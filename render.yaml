databases:
  - name: raja-fraz-master-history
    plan: free
    region: oregon
    databaseName: rajafraz_master

services:
  - type: web
    name: raja-fraz-master-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PV14000_API_BASE
        value: https://inverterzone-dashboard.onrender.com
      - key: META_DASHBOARD_USER
        value: admin
      - key: META_DASHBOARD_PASSWORD
        sync: false
      - key: PV9000_API_BASE
        sync: false
      - key: PV9000_DASHBOARD_USER
        value: admin
      - key: MATRIX_API_BASE
        value: https://fronus-matrix-dashboard.onrender.com
      - key: TUYA_API_BASE
        value: https://tuya-meter-dashboard.onrender.com
      - key: PV9000_LOAD_INCLUDES_UPS
        value: "true"
      - key: PV9000_LOAD_INCLUDES_SMART
        value: "false"
      - key: ELECTRICITY_RATE_PKR
        value: 60
      - key: EXPORT_RATE_PKR
        value: 0
      - key: NIGHT_IMPORT_LIMIT_W
        value: 5000
      - key: DAY_EXPORT_LIMIT_W
        value: 6000
      - key: DAY_MODE_START
        value: "07:30"
      - key: DAY_MODE_END
        value: "17:00"
      - key: BATTERY_CAPACITY_KWH
        value: 0
      - key: TARGET_DAILY_YIELD_KWH_PER_KWP
        value: 0
      - key: RECONCILIATION_ALERT_W
        value: 500
      - key: ALERT_TEMP_C
        value: 65
      - key: HISTORY_SAMPLE_SECONDS
        value: 60
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: AI_ACCESS_PIN
        sync: false
      - key: AI_MAX_OUTPUT_TOKENS
        value: 900
      - key: AI_RATE_LIMIT_REQUESTS
        value: 12
      - key: NOTIFY_ACCESS_PIN
        sync: false
      - key: ALERT_COOLDOWN_MINUTES
        value: 30
      - key: ALERT_STALE_SECONDS
        value: 180
      - key: BATTERY_LOW_PCT
        value: 20
      - key: NOTIFY_DASHBOARD_URL
        value: https://raja-fraz-master-dashboard.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://raja-fraz-master-dashboard.onrender.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_SMS_TO
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_TO
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: raja-fraz-master-history
          property: connectionString
