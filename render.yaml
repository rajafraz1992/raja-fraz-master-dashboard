databases:
  - name: raja-fraz-master-history
    plan: free
    region: oregon
    databaseName: rajafraz_master

services:
  - type: web
    name: raja-fraz-master-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: META_API_BASE
        value: https://inverterzone-dashboard.onrender.com
      - key: META_DASHBOARD_USER
        value: admin
      - key: META_DASHBOARD_PASSWORD
        sync: false
      - key: MATRIX_API_BASE
        value: https://fronus-matrix-dashboard.onrender.com
      - key: ELECTRICITY_RATE_PKR
        value: 60
      - key: HISTORY_SAMPLE_SECONDS
        value: 60
      - key: DATABASE_URL
        fromDatabase:
          name: raja-fraz-master-history
          property: connectionString
